<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220" style="background: linear-gradient(135deg, #0a0b10 0%, #12131c 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05);">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Gradients -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="line-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="line-purple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    @keyframes text-fade {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .node {
      transform-origin: center;
      animation: pulse 4s infinite ease-in-out;
    }
    .node-1 { animation-delay: 0s; color: #00f2fe; }
    .node-2 { animation-delay: 1.5s; color: #a855f7; }
    .node-3 { animation-delay: 3s; color: #4facfe; }

    .line-flow {
      stroke-dasharray: 8, 12;
      animation: dash 3s linear infinite;
    }
    .line-flow-fast {
      stroke-dasharray: 6, 10;
      animation: dash 1.8s linear infinite;
    }

    .bg-grid {
      opacity: 0.15;
      animation: glow-pulse 6s infinite ease-in-out;
    }

    .animate-text {
      animation: text-fade 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-sub {
      opacity: 0;
      animation: text-fade 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }
  </style>

  <!-- Background Decorative Grid -->
  <g class="bg-grid">
    <path d="M 0,20 L 800,20 M 0,60 L 800,60 M 0,100 L 800,100 M 0,140 L 800,140 M 0,180 L 800,180" stroke="#4facfe" stroke-width="0.5" />
    <path d="M 100,0 L 100,220 M 270,0 L 270,220 M 440,0 L 440,220 M 610,0 L 610,220 M 780,0 L 780,220" stroke="#4facfe" stroke-width="0.5" />
  </g>

  <!-- Neural Network/Quantum Graph (Left Side Decorative) -->
  <g opacity="0.8">
    <path d="M -50,110 L 80,60 M 80,60 L 160,140 M 80,60 L 140,40 M 160,140 L 220,110 M 140,40 L 220,110 M 220,110 L 320,150" stroke="url(#line-teal)" stroke-width="1.5" />
    <!-- Animated pulse paths on top -->
    <path class="line-flow" d="M -50,110 L 80,60 M 80,60 L 160,140 M 140,40 L 220,110" stroke="#00f2fe" stroke-width="2" fill="none" />
    <path class="line-flow-fast" d="M 80,60 L 140,40 M 160,140 L 220,110 M 220,110 L 320,150" stroke="#a855f7" stroke-width="2" fill="none" />

    <!-- Nodes -->
    <circle class="node node-1" cx="80" cy="60" r="6" fill="#00f2fe" filter="url(#glow-teal)" />
    <circle class="node node-2" cx="160" cy="140" r="5" fill="#a855f7" filter="url(#glow-purple)" />
    <circle class="node node-3" cx="140" cy="40" r="4" fill="#4facfe" />
    <circle class="node node-1" cx="220" cy="110" r="7" fill="#00f2fe" filter="url(#glow-teal)" />
  </g>

  <!-- Neural Network/Quantum Graph (Right Side Decorative) -->
  <g opacity="0.8">
    <path d="M 850,110 L 720,160 M 720,160 L 640,80 M 720,160 L 660,180 M 640,80 L 580,110 M 660,180 L 580,110 M 580,110 L 480,70" stroke="url(#line-purple)" stroke-width="1.5" />
    <!-- Animated pulse paths on top -->
    <path class="line-flow" d="M 850,110 L 720,160 M 720,160 L 640,80 M 660,180 L 580,110" stroke="#a855f7" stroke-width="2" fill="none" />
    <path class="line-flow-fast" d="M 720,160 L 660,180 M 640,80 L 580,110 M 580,110 L 480,70" stroke="#00f2fe" stroke-width="2" fill="none" />

    <!-- Nodes -->
    <circle class="node node-2" cx="720" cy="160" r="6" fill="#a855f7" filter="url(#glow-purple)" />
    <circle class="node node-1" cx="640" cy="80" r="5" fill="#00f2fe" filter="url(#glow-teal)" />
    <circle class="node node-3" cx="660" cy="180" r="4" fill="#4facfe" />
    <circle class="node node-2" cx="580" cy="110" r="7" fill="#a855f7" filter="url(#glow-purple)" />
  </g>

  <!-- Center Text -->
  <g transform="translate(400, 110)" text-anchor="middle">
    <!-- Title -->
    <text class="animate-text" y="-15" font-size="34" font-weight="800" letter-spacing="4" fill="url(#text-gradient)" style="filter: drop-shadow(0px 4px 12px rgba(0, 242, 254, 0.15));">S KARTHIK</text>
    <!-- Subtitle / Focus Areas -->
    <text class="animate-sub" y="25" font-size="15" font-weight="500" letter-spacing="2" fill="#94a3b8">AI • DEEP LEARNING • QUANTUM ML</text>
    
    <!-- Minor status bar -->
    <rect class="animate-sub" x="-120" y="45" width="240" height="2" fill="url(#text-gradient)" opacity="0.6" />
  </g>
</svg>
