<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100" fill="none">
  <defs>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="100%" stop-color="#06070c" />
    </linearGradient>
  </defs>

  <style>
    @keyframes border-glow {
      0%, 100% { stroke: rgba(0, 242, 254, 0.3); }
      50% { stroke: rgba(168, 85, 247, 0.6); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .border-rect {
      stroke-width: 1.5;
      animation: border-glow 4s infinite ease-in-out;
    }
    .ocular {
      stroke: #00f2fe;
      stroke-width: 1.5;
      fill: none;
      filter: url(#glow-teal);
    }
    .pulse-dot {
      fill: #00f2fe;
      animation: blink 1.5s infinite ease-in-out;
    }
    .card-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 13px;
      fill: #a855f7;
      letter-spacing: 1px;
    }
  </style>

  <!-- Card Background -->
  <rect width="400" height="100" rx="12" fill="url(#bg-grad)" />
  <rect class="border-rect" x="1" y="1" width="398" height="98" rx="11" fill="none" />

  <!-- Blinking Radar/Eye Vector on the Left -->
  <g transform="translate(45, 50)">
    <!-- Outer Eye shape -->
    <path class="ocular" d="M -25,0 Q 0,-16 25,0 Q 0,16 -25,0 Z" />
    <!-- Pupil -->
    <circle cx="0" cy="0" r="6" stroke="#00f2fe" stroke-width="1.5" />
    <circle class="pulse-dot" cx="0" cy="0" r="2.5" />
  </g>

  <!-- Title -->
  <text class="card-text" x="100" y="36">SYSTEM PROFILE VIEWS</text>

  <!-- Embedded Live Badge -->
  <image href="https://visitor-badge.laobi.icu/badge?page_id=Karthik7661.Karthik7661&amp;color=00f2fe" x="100" y="46" width="180" height="28" />
</svg>
