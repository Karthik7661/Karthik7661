<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="100%" height="12" fill="none">
  <style>
    @keyframes pulse-flow {
      0% {
        x: -150px;
      }
      100% {
        x: 800px;
      }
    }
    .base-line {
      stroke: #1e293b;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    .glow-runner {
      animation: pulse-flow 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
  <defs>
    <!-- Glowing Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Line -->
  <line x1="10" y1="6" x2="790" y2="6" class="base-line" />

  <!-- Animated Glowing Pulse Line -->
  <rect x="0" y="4" width="150" height="4" rx="2" fill="url(#glow-grad)" class="glow-runner" filter="url(#neon-glow)" />
</svg>
