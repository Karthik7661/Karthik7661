<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="100%" height="80" fill="none">
  <defs>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="100%" stop-color="#06070c" />
    </linearGradient>
  </defs>
  <style>
    @keyframes signal-wave {
      0% { r: 5; opacity: 0.8; }
      100% { r: 20; opacity: 0; }
    }
    @keyframes border-glow {
      0%, 100% { stroke: rgba(0, 242, 254, 0.2); }
      50% { stroke: rgba(168, 85, 247, 0.4); }
    }
    .border-rect {
      stroke-width: 1.5;
      animation: border-glow 5s infinite ease-in-out;
    }
    .signal {
      animation: signal-wave 2s infinite cubic-bezier(0.16, 1, 0.3, 1);
      stroke: #00f2fe;
      stroke-width: 1.5;
    }
    .signal-delay {
      animation-delay: 1s;
    }
  </style>
  <rect width="380" height="80" rx="12" fill="url(#bg-grad)" />
  <rect class="border-rect" x="1" y="1" width="378" height="78" rx="11" fill="none" />
  <g transform="translate(35, 40)">
    <circle class="signal" cx="0" cy="0" r="5" fill="none" />
    <circle class="signal signal-delay" cx="0" cy="0" r="5" fill="none" />
    <circle cx="0" cy="0" r="6" fill="#00f2fe" filter="url(#glow-teal)" />
    <path d="M-8,-6 L8,-6 L8,6 L-8,6 Z M-8,-6 L0,0 L8,-6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <g transform="translate(75, 35)">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#00f2fe" letter-spacing="1">LET'S CONNECT</text>
    <text y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Feel free to reach out for collaborations!</text>
  </g>
</svg>
