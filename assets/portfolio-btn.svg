<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120" fill="none">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="100%" stop-color="#06070c" />
    </linearGradient>
  </defs>

  <style>
    @keyframes border-flow {
      0%, 100% { stroke: #00f2fe; filter: drop-shadow(0 0 4px #00f2fe); }
      50% { stroke: #a855f7; filter: drop-shadow(0 0 10px #a855f7); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
    }
    @keyframes arrow-move {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(5px); }
    }
    @keyframes bg-glow {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.4; }
    }

    .border-rect {
      stroke-width: 1.5;
      animation: border-flow 4s infinite ease-in-out;
    }
    .cta-button {
      transform-origin: 670px 60px;
      animation: pulse 2s infinite ease-in-out;
      cursor: pointer;
    }
    .cta-arrow {
      animation: arrow-move 1.5s infinite ease-in-out;
      transform-origin: center;
    }
    .bg-lights {
      animation: bg-glow 5s infinite ease-in-out;
    }
    .interactive-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Obsidian Background -->
  <rect width="800" height="120" rx="14" fill="url(#bg-grad)" />
  <rect class="border-rect" x="1" y="1" width="798" height="118" rx="13" fill="none" />

  <!-- Ambient Light Effects (Background) -->
  <circle class="bg-lights" cx="150" cy="60" r="50" fill="#00f2fe" opacity="0.1" filter="blur(20px)" />
  <circle class="bg-lights" cx="650" cy="60" r="50" fill="#a855f7" opacity="0.1" filter="blur(20px)" />

  <!-- Left: Globe/Browser Icon -->
  <g transform="translate(40, 35)">
    <!-- Browser Mockup frame -->
    <rect x="0" y="0" width="60" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="10" cy="8" r="2.5" fill="#ff5f56" />
    <circle cx="20" cy="8" r="2.5" fill="#ffbd2e" />
    <circle cx="30" cy="8" r="2.5" fill="#27c93f" />
    <!-- Glowing page mockup content -->
    <rect x="8" y="18" width="44" height="6" rx="2" fill="#00f2fe" opacity="0.6" />
    <rect x="8" y="28" width="28" height="5" rx="1.5" fill="#a855f7" opacity="0.4" />
    <circle cx="42" cy="30" r="3" fill="#00f2fe" opacity="0.8" />
  </g>

  <!-- Center Text -->
  <g transform="translate(130, 40)" class="interactive-text">
    <text x="0" y="15" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="1">EXPLORE MY INTERACTIVE PORTFOLIO</text>
    <text x="0" y="38" fill="#94a3b8" font-size="13" font-weight="500" letter-spacing="0.5">portfolio-one-gules-juc6kxjk7e.vercel.app</text>
  </g>

  <!-- Right: Glowing CTA Button -->
  <g class="cta-button" transform="translate(560, 38)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="url(#btn-grad)" />
    <!-- White Inner Glow Border -->
    <rect x="1.5" y="1.5" width="177" height="41" rx="20.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    
    <text class="interactive-text" x="72" y="27" fill="#ffffff" font-size="14" font-weight="bold" letter-spacing="1.5" text-anchor="middle">LAUNCH</text>
    
    <!-- Animated Arrow -->
    <g class="cta-arrow" transform="translate(132, 22)">
      <path d="M-5,-5 L3,0 L-5,5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <line x1="-12" y1="0" x2="1" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
