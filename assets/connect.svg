<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" height="140" fill="none">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="100%" stop-color="#06070c" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse-teal {
      0%, 100% { fill: #00f2fe; opacity: 0.8; filter: drop-shadow(0 0 2px #00f2fe); }
      50% { fill: #4facfe; opacity: 1; filter: drop-shadow(0 0 8px #4facfe); }
    }
    @keyframes pulse-purple {
      0%, 100% { fill: #a855f7; opacity: 0.8; filter: drop-shadow(0 0 2px #a855f7); }
      50% { fill: #e879f9; opacity: 1; filter: drop-shadow(0 0 8px #e879f9); }
    }
    @keyframes signal-wave {
      0% { r: 5; opacity: 0.8; }
      100% { r: 25; opacity: 0; }
    }
    @keyframes border-glow {
      0%, 100% { stroke: rgba(0, 242, 254, 0.2); }
      50% { stroke: rgba(168, 85, 247, 0.4); }
    }

    .border-rect {
      stroke-width: 1.5;
      animation: border-glow 5s infinite ease-in-out;
    }
    .signal {
      animation: signal-wave 2s infinite cubic-bezier(0.16, 1, 0.3, 1);
      stroke: #00f2fe;
      stroke-width: 1.5;
    }
    .signal-delay {
      animation-delay: 1s;
    }
    .indicator-teal {
      animation: pulse-teal 2s infinite ease-in-out;
    }
    .indicator-purple {
      animation: pulse-purple 2s infinite ease-in-out;
      animation-delay: 1s;
    }
    .btn-group {
      cursor: pointer;
    }
    .btn-bg-teal {
      fill: rgba(0, 242, 254, 0.05);
      stroke: rgba(0, 242, 254, 0.3);
      stroke-width: 1.5;
      rx: 8;
      transition: stroke 0.3s;
    }
    .btn-bg-teal:hover {
      stroke: rgba(0, 242, 254, 0.8);
      fill: rgba(0, 242, 254, 0.1);
    }
    .btn-bg-purple {
      fill: rgba(168, 85, 247, 0.05);
      stroke: rgba(168, 85, 247, 0.3);
      stroke-width: 1.5;
      rx: 8;
      transition: stroke 0.3s;
    }
    .btn-bg-purple:hover {
      stroke: rgba(168, 85, 247, 0.8);
      fill: rgba(168, 85, 247, 0.1);
    }
    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .btn-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      fill: #94a3b8;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="140" rx="14" fill="url(#bg-grad)" />
  <rect class="border-rect" x="1" y="1" width="798" height="138" rx="13" fill="none" />

  <!-- Animated Connection Wave (Left Side) -->
  <g transform="translate(60, 70)">
    <circle class="signal" cx="0" cy="0" r="5" fill="none" />
    <circle class="signal signal-delay" cx="0" cy="0" r="5" fill="none" />
    <circle cx="0" cy="0" r="6" fill="#00f2fe" filter="url(#glow-teal)" />
    <!-- Envelope Icon -->
    <path d="M-10,-7 L10,-7 L10,7 L-10,7 Z M-10,-7 L0,1 L10,-7" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Connect Text Header -->
  <g transform="translate(110, 52)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00f2fe" letter-spacing="1">LET'S CONNECT</text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Feel free to reach out for collaborations or inquiries!</text>
  </g>

  <!-- Email Button -->
  <a href="mailto:skarthik7661@gmail.com" target="_blank">
    <g class="btn-group" transform="translate(420, 38)">
      <rect class="btn-bg-teal" width="165" height="64" />
      <circle class="indicator-teal" cx="22" cy="32" r="5" />
      <text class="btn-text" x="42" y="28">Send Email</text>
      <text class="btn-sub" x="42" y="46">skarthik7661@...</text>
    </g>
  </a>

  <!-- GitHub Button -->
  <a href="https://github.com/Karthik7661" target="_blank">
    <g class="btn-group" transform="translate(605, 38)">
      <rect class="btn-bg-purple" width="165" height="64" />
      <circle class="indicator-purple" cx="22" cy="32" r="5" />
      <text class="btn-text" x="42" y="28">GitHub</text>
      <text class="btn-sub" x="42" y="46">Follow @Karthik7661</text>
    </g>
  </a>
</svg>
